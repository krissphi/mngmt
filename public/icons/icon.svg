<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#4338ca" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded rectangle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="510" height="510" x="1" y="1" rx="111" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2" />

  <!-- Geometric Layered Diamonds (ARKAOS Emblem) -->
  <g transform="translate(256, 256)">
    <!-- Ambient back glow -->
    <circle r="120" fill="#6366f1" opacity="0.25" filter="url(#glow)" />

    <!-- Bottom Layer: Cash / Stability (Emerald Accent) -->
    <path d="M 0 110 L 100 50 L 0 -10 L -100 50 Z" fill="url(#accentGrad)" opacity="0.9" />

    <!-- Middle Layer: Business / Growth (Dark Violet) -->
    <path d="M 0 50 L 100 -10 L 0 -70 L -100 -10 Z" fill="#4338ca" opacity="0.85" />

    <!-- Top Layer: Wealth / Portfolio Apex (Indigo Gradient with Glow) -->
    <path d="M 0 -10 L 100 -70 L 0 -130 L -100 -70 Z" fill="url(#primaryGrad)" filter="url(#glow)" />

    <!-- Inner Core Highlight Diamond -->
    <path d="M 0 -25 L 50 -55 L 0 -85 L -50 -55 Z" fill="#ffffff" opacity="0.3" />
  </g>

  <!-- Text brand mark subtly placed at bottom -->
  <text x="256" y="440" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="800" fill="#f8fafc" letter-spacing="8" text-anchor="middle">mngmt</text>
</svg>

